<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur le carreau</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;600;700&display=swap">
<style>
:root{--disp:'Poppins','DM Sans',system-ui,sans-serif;--sky:#03040E;--floor:#1740C8;--floor2:#0A1F7A;--tile:rgba(4,8,36,.82);--ink:#F4F6FF;--p1:#FFC53D;--p2:#5CE1FF;--ok:#3DDC97;--ko:#FF6B6B;--line:rgba(255,255,255,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;position:relative}
body::before{content:"";position:fixed;inset:0 0 40% 0;z-index:-2;background:radial-gradient(ellipse 60% 50% at 50% 0,rgba(120,150,255,.28),transparent 70%),radial-gradient(circle,#fff 0 1px,transparent 1.6px) 0 0/46px 46px,radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.6px) 23px 17px/61px 61px,var(--sky)}
body::after{content:"";position:fixed;left:-60%;right:-60%;bottom:0;height:62vh;z-index:-1;background:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(180deg,var(--floor2),var(--floor));background-size:90px 90px,90px 90px,100% 100%;background-position:center bottom;transform:perspective(520px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
[hidden]{display:none!important}
main{max-width:980px;margin:0 auto;padding:20px 16px 32px}
h1{font:400 clamp(2.6rem,9vw,4.6rem)/1 var(--disp);margin:8px 0 12px;letter-spacing:.02em;text-shadow:0 0 28px rgba(110,150,255,.7)}
p.lead{max-width:56ch;margin:0 0 24px}
.panel{background:var(--tile);border:2px solid var(--line);border-radius:6px;padding:20px;backdrop-filter:blur(4px)}
form.setup{display:grid;gap:14px;max-width:520px}
label{display:grid;gap:4px;font-weight:600}
input,select,button{font:inherit;color:inherit}
input,select{background:#050A2C;border:2px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{cursor:pointer;border:0;border-radius:4px;padding:12px 18px;font-weight:700;background:var(--p1);color:#101B4D;box-shadow:0 0 18px rgba(255,197,61,.45)}
button.alt{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.arena{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c c";gap:12px}
@media(min-width:760px){.arena{grid-template-columns:1fr minmax(0,1.7fr) 1fr;grid-template-areas:"a c b"}}
#s0{grid-area:a;--c:var(--p1)}#s1{grid-area:b;--c:var(--p2)}.center{grid-area:c}
.side{background:var(--tile);border:2px solid var(--line);border-radius:6px;padding:14px;text-align:center;align-self:start;transition:border-color .2s,box-shadow .2s}
.side.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 0 32px color-mix(in srgb,var(--c) 55%,transparent)}
.nm{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--c);color:#101B4D;font-weight:700;border-radius:4px;padding:2px 12px}
.tm{font:400 clamp(2.8rem,9vw,4.6rem)/1.1 var(--disp);font-variant-numeric:tabular-nums;margin-top:6px}
.side:not(.on) .tm{opacity:.55}
.side.low .tm{color:var(--ko)}
.center{text-align:center}
#who{font-weight:700;min-height:1.6em}
#card,#acard{font-size:clamp(6rem,24vw,11rem);line-height:1.15;background:linear-gradient(#0B1B7E,#13309F);border:3px solid #9DB8FF;border-radius:6px;box-shadow:0 0 0 3px #050A2C,0 0 38px rgba(110,150,255,.65);margin:8px 0;padding:8px 0;user-select:none}
#msg{min-height:1.6em;font-weight:700}
#msg.ok{color:var(--ok)}#msg.ko{color:var(--ko)}
#msg.ko{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){#msg.ko{animation:none}.side{transition:none}}
.answer{display:flex;gap:8px;max-width:460px;margin:8px auto}
.answer input{flex:1;font-size:1.2rem}
#end .panel{max-width:520px}
#end h2{font:400 2rem/1.1 var(--disp);margin:0 0 8px}
#acard{font-size:clamp(4rem,18vw,7rem)}
#aans{font-weight:700;font-size:1.3rem;min-height:1.6em}
#code{font:400 2.6rem/1 var(--disp);letter-spacing:.2em;color:var(--p1);margin:0 0 12px}
.big{display:block;width:100%;margin:10px 0;padding:22px;font-size:1.4rem}
.good{background:var(--ok);box-shadow:0 0 18px rgba(61,220,151,.45)}
.skip{background:var(--ko);box-shadow:0 0 18px rgba(255,107,107,.45)}
button:disabled{opacity:.4;cursor:not-allowed}
.slc-snd-btn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;width:40px;height:40px;padding:0;font-size:1.1rem;line-height:1;background:rgba(4,8,36,.7);border:2px solid var(--line);color:var(--ink);box-shadow:none}
button,.nm,#who,#aans,label{font-family:var(--disp);font-weight:600}
h1,.tm,#code,#end h2{font-weight:700}
h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.1}
.tm{font-size:clamp(2.4rem,8vw,4rem);line-height:1.15}
#code{font-size:2.4rem}
#end h2{font-size:1.8rem}
.nm{font-size:1rem}
#aans{font-size:1.15rem}
.big{font-size:1.25rem}
#a0{--c:var(--p1)}#a1{--c:var(--p2)}
#arb{max-width:520px;margin:0 auto}
.fields{display:grid;gap:14px}
.gnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
#grid{max-width:760px;margin:0 auto}
#gtitle{font:700 clamp(1.4rem,5vw,2rem)/1.2 var(--disp);margin:0 0 4px;overflow-wrap:anywhere}
#ghint,#gstat,#dcat{margin:4px 0}
#gnote{margin:4px 0;min-height:0;font-weight:700;color:var(--p1)}
#gnote:empty{display:none}
.gpanel button[aria-pressed="true"]{border-color:var(--p1);background:rgba(255,197,61,.18)}
#dgold{margin:4px 0;font-weight:700;color:var(--p1)}
#dgold:empty{display:none}
#dcat{font-weight:600}
.gboard{margin:12px 0;position:relative}
.gboard svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--disp);-webkit-tap-highlight-color:transparent}
.gz{stroke:none;transition:fill .45s ease;outline:none}
.gz.t{cursor:pointer}
.ge{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .5s,stroke-width .5s,stroke-opacity .5s}
.ge.in{stroke:#fff;stroke-opacity:.16;stroke-width:1}
.ge.fr{stroke:#fff;stroke-opacity:.95;stroke-width:2.6}
.ge.bd{stroke:#fff;stroke-opacity:.85;stroke-width:3}
.go{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;pointer-events:none;opacity:0;transition:opacity .5s}
.go.on{opacity:1}
.gt{fill:none;stroke:none;pointer-events:none}
.gt.foc{stroke:#fff;stroke-width:5}
.gz.pick{animation:gpick .45s ease-in-out infinite alternate}
@keyframes gpick{to{filter:brightness(1.3)}}
.gl{pointer-events:none;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:rgba(3,4,14,.72);stroke-linejoin:round;transition:opacity .4s}
.gl .gn{font-weight:700}
.gl .gc{font-weight:500;fill:#DCE5FF}
.gl.fade{opacity:0}
@media(prefers-reduced-motion:reduce){.gz.pick{animation:none}.gz,.ge,.go,.gl{transition-duration:.2s}}
.gpanel{display:grid;gap:10px;justify-items:start}
.gpanel p{margin:0;font-weight:600}
#card.mot,#acard.mot{font-size:16px;padding:22px 6px;user-select:none}
#card.pho,#acard.pho{font-size:4rem;padding:8px}
#card.pho img,#acard.pho img{display:block;max-width:100%;max-height:min(46vh,440px);margin:0 auto;border-radius:4px;object-fit:contain}
#acard.pho img{max-height:30vh}
#atype{margin:10px 0;padding:12px 14px}
#agold{margin:4px 0;font-weight:700;color:var(--p1)}
#agold:empty{display:none}
#atype p{margin:0}
#atype .tn{font:700 1.1rem/1.3 var(--disp)}
#atype .tc{margin-top:4px}
a.btnlink{display:block;text-align:center;text-decoration:none;font:600 1rem/1.5 var(--disp);border:2px solid var(--line);border-radius:4px;padding:10px 18px;color:var(--ink)}
a.btnlink:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
/* Choix des catégories de la grille */
.pick{display:grid;gap:10px;border:2px solid var(--line);border-radius:6px;padding:12px;background:rgba(5,10,44,.55)}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.ptitle{font:600 1rem/1.3 var(--disp)}
.pcount{font:700 1rem/1.3 var(--disp);font-variant-numeric:tabular-nums;border-radius:4px;padding:2px 10px;color:#101B4D}
.pcount.ok{background:var(--ok)}.pcount.short{background:var(--p1)}.pcount.over{background:var(--ko)}
.pnote,.perr,.pinfo{margin:0;font-size:.95rem}
.pnote{color:#BFD0FF}
.perr{color:var(--ko);font-weight:700}
.pinfo{opacity:.85}
.pwarn{margin:0;padding:0 0 0 1.2em;font-size:.9rem;color:#FFD98A}
#pchosen{display:grid;gap:12px}
.pgroup{display:grid;gap:6px}
.pgroup h3{margin:0;font:600 .9rem/1.3 var(--disp);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:#13309F;border:2px solid #6A8CFF;border-radius:4px;padding:2px 2px 2px 10px;font-weight:600;font-size:.92rem}
.chip.warn{border-color:#FFC53D}
.chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ci{opacity:.7;font-weight:400;font-variant-numeric:tabular-nums}
.chip button{background:transparent;color:var(--ink);box-shadow:none;padding:4px 8px;line-height:1;border-radius:3px}
.chip button:hover{background:rgba(255,255,255,.15)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.pbtns button{padding:8px 12px;font-size:.95rem}
.ppool{display:grid;gap:6px}
.ppool h3{margin:0;font:600 .95rem/1.3 var(--disp)}
.ppool details{border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.ppool summary{cursor:pointer;font-weight:600}
.ppool .chips{margin-top:8px}
.padd{background:transparent;color:var(--ink);border:2px dashed rgba(255,255,255,.4);box-shadow:none;padding:4px 10px;font-size:.92rem;font-weight:600}
.padd:hover:not(:disabled){border-color:var(--p1)}
#gowhy{margin:0;color:var(--ko);font-weight:700}
</style>
<script src="intro.js"></script>
<script src="sons.js"></script>
</head>
<body>
<main>
<section id="setup">
  <h1>Sur le carreau</h1>
  <p class="lead" id="lead"></p>
  <p id="cerr" role="alert" hidden></p>
  <form id="form" class="panel setup">
    <label>Mode de jeu
      <select id="gmode"><option value="grid" selected>Grille de territoires</option><option value="duel">Duel à deux</option></select>
    </label>
    <div id="duelfields" class="fields" hidden>
      <div class="row2">
        <label>Joueur 1<input id="n0" maxlength="14" placeholder="Joueur 1" autocomplete="off"></label>
        <label>Joueur 2<input id="n1" maxlength="14" placeholder="Joueur 2" autocomplete="off"></label>
      </div>
      <label>Catégorie<select id="cat"></select></label>
    </div>
    <div id="gridfields" class="fields">
      <label>Taille de la grille<select id="gsize"></select></label>
      <div id="gpick" class="pick">
        <div class="phead"><span class="ptitle" id="ptitle">Catégories de la partie</span><span id="pcount" class="pcount" role="status" aria-live="polite"></span></div>
        <p id="pnote" class="pnote" role="status" aria-live="polite"></p>
        <div id="pchosen" aria-labelledby="ptitle"></div>
        <ul id="pwarn" class="pwarn"></ul>
        <div class="pbtns">
          <button type="button" class="alt" id="pdraw">🎲 Nouveau tirage</button>
          <button type="button" id="pfill">Compléter au hasard</button>
          <button type="button" id="ptrim">Retirer au hasard</button>
        </div>
        <p id="perr" class="perr"></p>
        <div id="ppool" class="ppool"></div>
      </div>
      <div id="gnames" class="gnames"></div>
    </div>
    <p id="gowhy" hidden></p>
    <button type="submit" id="gosubmit" aria-describedby="gowhy">Lancer le duel</button>
    <button type="button" class="alt" id="toarb">Je suis l’arbitre</button>
    <a class="btnlink" href="editeur.html" id="toedit">✏️ Créer mes catégories (mots à trous, photos)</a>
  </form>
</section>

<section id="game" hidden>
  <div class="arena">
    <div class="side" id="s0"><span class="nm" id="nm0"></span><div class="tm" id="tm0"></div><div id="sc0"></div></div>
    <div class="side" id="s1"><span class="nm" id="nm1"></span><div class="tm" id="tm1"></div><div id="sc1"></div></div>
    <div class="center">
      <div id="wait" class="panel" hidden>
        <p>Code à saisir sur la page arbitre</p>
        <div id="code"></div>
        <p id="wst" role="status"></p>
        <p id="lnk" role="status"></p>
        <button type="button" id="go" disabled>Démarrer le duel</button>
        <button type="button" class="alt" id="newcode">Nouveau code</button>
        <button type="button" class="alt" id="wback" hidden>Retour à la grille</button>
      </div>
      <p id="dcat"></p>
      <p id="dgold" role="status"></p>
      <div id="who"></div>
      <div id="card" aria-label="Image à nommer"></div>
      <div id="msg" role="status" aria-live="polite"></div>
      <form id="f2" class="answer" autocomplete="off">
        <input id="ans" placeholder="Votre réponse" aria-label="Votre réponse" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="submit">Valider</button>
      </form>
      <button type="button" class="alt" id="pass">Passer (−3 s)</button>
    </div>
  </div>
</section>

<section id="grid" hidden>
  <h2 id="gtitle"></h2>
  <p id="ghint"></p>
  <p id="gnote" role="status" aria-live="polite"></p>
  <div id="gboard" class="gboard"></div>
  <div id="gpanel" class="panel gpanel"></div>
  <p id="gstat" role="status"></p>
  <button type="button" class="alt" id="gquit">Quitter la partie</button>
</section>

<section id="arb" hidden>
  <h1>Arbitre</h1>
  <form id="rj" class="panel setup">
    <label>Code affiché sur l’écran du jeu<input id="rc" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <button type="submit">Rejoindre le duel</button>
    <button type="button" class="alt" id="arback">Retour</button>
  </form>
  <div id="rl" hidden>
    <div class="row2">
      <div class="side" id="a0"><span class="nm"></span><div class="tm"></div></div>
      <div class="side" id="a1"><span class="nm"></span><div class="tm"></div></div>
    </div>
    <p id="actx"></p>
    <p id="agold"></p>
    <div id="atype" class="panel" hidden><p class="tn"></p><p class="tc"></p></div>
    <div id="acard" class="center" aria-label="Image en cours"></div>
    <p id="aans" role="status"></p>
    <button type="button" class="big good" id="bok" disabled>Bonne réponse</button>
    <button type="button" class="big skip" id="bpass" disabled>Passé (−3 s)</button>
    <p id="ast" role="status"></p>
    <p id="alk" role="status"></p>
  </div>
</section>

<section id="end" hidden>
  <div class="panel">
    <h2 id="win"></h2>
    <p id="res"></p>
    <button type="button" id="again">Nouvelle partie</button>
  </div>
</section>
</main>

<script src="categories.js"></script>
<script src="perso.js"></script>
<script>
const DATA={};
const $=id=>document.getElementById(id);
/* Types de catégories : « emoji » (par défaut), « trous » (mot à trous) et « photo ». Chaque élément est
   ramené à [clé unique, "réponse|variante", niveau, {img, thumb} pour une photo]. Pour un mot à trous,
   ce que voient les joueurs est calculé à chaque tirage (lettres cachées au hasard). */
const TYPES=(window.SLC_PERSO&&SLC_PERSO.TYPES)||{emoji:{nom:'Images',consigne:'Nommez ce que montre l’image.'}};
const typeName=t=>t&&t!=='emoji'&&TYPES[t]?TYPES[t].nom:'';
function normItem(type,it){
  if(type==='trous'){
    const w=typeof it==='string'?it:Array.isArray(it)?it[0]:null;
    if(typeof w!=='string'||!w.trim())return null;
    const l=Array.isArray(it)&&[1,2,3].includes(it[1])?it[1]:window.SLC_PERSO?SLC_PERSO.autoLevel(w):2;
    return['mot:'+w.split('|')[0].trim().toLowerCase(),w,l];
  }
  if(!Array.isArray(it)||typeof it[0]!=='string'||!it[0]||typeof it[1]!=='string'||!it[1].trim())return null;
  if(type==='photo')return['photo:'+it[0],it[1],[1,2,3].includes(it[2])?it[2]:1,{img:it[0],thumb:typeof it[3]==='string'?it[3]:it[0]}];
  return[1,2,3].includes(it[2])?[it[0],it[1],it[2]]:null;
}
function addCats(src){
  if(src&&typeof src==='object')for(const [k,v] of Object.entries(src)){
    const type=(v&&v.type)||'emoji';
    if(!v||typeof v.label!=='string'||!Array.isArray(v.items)||!TYPES[type]){console.warn('Catégorie ignorée :',k);continue}
    const items=[],seen=new Set();
    v.items.forEach((raw,n)=>{
      const it=normItem(type,raw);
      if(!it){console.warn('Élément ignoré dans « '+k+' » (n° '+(n+1)+') :',raw);return}
      if(seen.has(it[0])){console.warn('Doublon ignoré dans « '+k+' » :',it[0]);return}
      seen.add(it[0]);items.push(it);
    });
    if(items.length)DATA[k]={label:v.label,type,items,perso:!!v.perso};else console.warn('Catégorie vide ignorée :',k);
  }
}
addCats(typeof CATEGORIES==='undefined'?null:CATEGORIES);

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(le|la|les|l|un|une|des|du|de|d)\b/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function isOk(v,list){v=norm(v);if(!v)return false;return list.some(r=>{r=norm(r);if(v===r)return true;const t=r.length>=9?2:r.length>=5?1:0;return t>0&&lev(v,r)<=t})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){['setup','game','grid','end','arb'].forEach(x=>$(x).hidden=x!==id)}

// Temps de chaque joueur pour un duel (secondes). Le détenteur de la case d'or peut y ajouter GOLD_SEC.
const DUEL_SEC=40;
let S,flashT;
const CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789',isArb=location.hash==='#arbitre';
let peerLib;
function loadPeer(){
  if(window.Peer)return Promise.resolve();
  return peerLib||(peerLib=new Promise((ok,ko)=>{const el=document.createElement('script');el.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';el.onload=ok;el.onerror=()=>ko(new Error('peerjs'));document.head.appendChild(el)}));
}
const rnd=()=>Math.random().toString(36).slice(2);
/* Liaison jeu <-> arbitre. Trois chemins, essayés dans l'ordre :
   1. claude.ai : capacité "room" (aucun service externe) ;
   2. ailleurs (GitHub Pages…) : PeerJS, connexion directe entre appareils ;
   3. à défaut : BroadcastChannel (onglets du même navigateur seulement).
   onstat(mode,état) sert à afficher l'état de la liaison. */
/* Serveurs STUN/TURN : le TURN relaie la connexion quand deux appareils sont sur des réseaux
   différents (wifi + 4G/5G). Services publics gratuits, sans garantie : à remplacer par un TURN à soi si besoin. */
const ICE=[
  {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:global.stun.twilio.com:3478']},
  {urls:'turn:eu-0.turn.peerjs.com:3478',username:'peerjs',credential:'peerjsp'},
  {urls:'turn:us-0.turn.peerjs.com:3478',username:'peerjs',credential:'peerjsp'},

async function link(code,role,onmsg,onstat){
  let bc=null;try{if(typeof BroadcastChannel==='function')bc=new BroadcastChannel('slc-'+code)}catch(e){bc=null}
  const seen=new Set();
  const hear=(topic,d)=>{if(!d||d.role===role||seen.has(d.id))return;seen.add(d.id);onmsg(topic,d)};
  if(bc)bc.onmessage=e=>hear(e.data.topic,e.data.d);
  let room=null,peer=null,conns=[],mode='local',missing=false;
  const stat=st=>{try{if(onstat)onstat(mode,st)}catch(e){}};
  try{const r=window.claude&&await claude.use('room');if(r){room=await r.join('slc-'+code.toLowerCase());['st','act','hi'].forEach(t=>room.on(t,m=>hear(t,m.data),()=>{}));mode='claude'}}catch(e){room=null}
  if(room)stat('ok');
  else{
    try{
      await loadPeer();
      const id='slc-'+code.toLowerCase();
      peer=await new Promise((ok,ko)=>{
        const p=new Peer(role==='game'?id:undefined,window.SLC_PEER_OPTS||{debug:0,config:{iceServers:ICE,iceCandidatePoolSize:4}});
        const to=setTimeout(()=>ko({type:'timeout'}),10000);
        p.on('open',()=>{clearTimeout(to);ok(p)});
        p.on('error',e=>{clearTimeout(to);ko(e)});
      });
      mode='peer';
      peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
      peer.on('error',e=>{if(e&&e.type==='peer-unavailable'){missing=true;stat('search')}else stat('down')});
      const wire=c=>{
        c.on('data',m=>{if(m)hear(m.topic,m.d)});
        c.on('error',()=>{});
      };
      if(role==='game'){
        stat('wait');
        peer.on('connection',c=>{
          wire(c);
          c.on('open',()=>{conns.push(c);stat('ok')});
          c.on('close',()=>{conns=conns.filter(x=>x!==c);stat(conns.length?'ok':'wait')});
        });
      }else{
        stat('search');
        let conn=null,t0=0,tries=0;
        const attempt=()=>{
          if(conn&&conn.open)return;
          if(conn&&Date.now()-t0<8000)return;
          if(conn){try{conn.close()}catch(e){}}
          const c=conn=peer.connect(id,{reliable:true,serialization:'json'});t0=Date.now();missing=false;if(++tries>=4&&!missing)setTimeout(()=>{if(!missing&&!(conn&&conn.open))stat('blocked')},4000);
          wire(c);
          c.on('open',()=>{conns=[c];tries=0;stat('ok');c.send({topic:'hi',d:{role,id:rnd()}})});
          c.on('close',()=>{if(conn===c){conns=[];stat('search')}});

      if(peer){try{peer.destroy()}catch(_){}}

      peer=null;mode='local';stat('local');
    }
  }
  return{send(topic,d){
    d={...d,role,id:rnd()};
    if(bc)bc.postMessage({topic,d});
    if(room)room.emit(topic,d).catch(()=>{});
    for(const c of conns)if(c.open)try{c.send({topic,d})}catch(e){}

}
const linkMsg=(mode,st)=>{

/* ---------- Grille de territoires ----------
   Une case par joueur, chacune avec une catégorie tirée au sort. Le joueur « qui a la main » défie
   le propriétaire d'une case voisine ; le duel se joue dans la catégorie de cette case. Le perdant

   Retourner sur le sol remet la série à zéro. Un seul bonus à la fois : une 3e victoire en le détenant déjà est
   sans effet (sauf s'il vient de servir dans ce duel). Le bonus est consommé à la fin du duel où il a servi ; il disparaît avec son détenteur s'il est éliminé. */

function gtargets(){const f=gfoes();return G.cells.map((_,i)=>i).filter(i=>f.includes(G.cells[i].owner))}

function gridRender(){
  const alive=G.players.filter(p=>p.alive).length,tg=G.over||G.draw?[]:gtargets();
  $('gtitle').textContent=G.over?G.players[G.ch].name+' remporte la partie !':G.draw?'Retour sur le sol…':G.players[G.ch].name+' choisit son adversaire';
  $('ghint').textContent=G.over?'Toutes les cases lui appartiennent.':G.draw?'Tirage au sort parmi les candidats '+(G.drawFresh?'qui n’ont pas encore joué.':'en lice.'):'Territoire de '+G.players[G.ch].name+' : '+(G.players[G.ch].gold?'jaune (case d’or)':'violet')+'. Adversaires possibles : bleu clair.'+G.players.filter((q,i)=>q.alive&&q.gold&&i!==G.ch).map(q=>' En jaune : '+q.name+' (case d’or).').join('');
  if(G.sel==null)G.use.clear();else for(const q of G.use)if(q!==G.ch&&q!==G.sel)G.use.delete(q);
  $('gnote').textContent=G.over?'':G.note;
  if(gAnimT){cancelAnimationFrame(gAnimT);gAnimT=null}
  const A=G.anim;G.anim=null;
  gboardBuild(tg);
  gpaint(A?i=>A.cells.includes(i)?A.old:G.cells[i].owner:i=>G.cells[i].owner);
  if(A)gcapture(A);
  const p=$('gpanel');p.textContent='';
  const sol=()=>gdrawPool().pool.length?gbtn('Retourner sur le sol','alt',gdraw):null;
  if(G.over){
    p.append(gbtn('Nouvelle partie','',()=>show('setup')));
  }else if(G.draw){
    const t=document.createElement('p');t.textContent='Tirage au sort d’un candidat…';p.append(t);
  }else if(G.sel!=null){
    const a=G.players[G.ch],d=G.players[G.sel],t=document.createElement('p');
    const dc=DATA[G.cells[G.sel].cat];
    t.textContent=a.name+' défie '+d.name+' en « '+dc.label+' »'+(typeName(dc.type)?' ('+typeName(dc.type).toLowerCase()+')':'')+'.';
    p.append(t);
    // Case d'or : chaque détenteur concerné décide avant le duel s'il l'utilise.
    [G.ch,G.sel].forEach(q=>{
      if(!G.players[q].gold)return;
      const on=G.use.has(q),b=gbtn((on?'★ ':'☆ ')+G.players[q].name+' utilise sa case d’or (+'+GOLD_SEC+' s)','alt',()=>{G.use.has(q)?G.use.delete(q):G.use.add(q);gridRender();const f=[...$('gpanel').querySelectorAll('button')].find(x=>x.dataset.q==q);if(f)f.focus()});
      b.dataset.q=q;b.setAttribute('aria-pressed',on?'true':'false');p.append(b);
    });
    p.append(gbtn('Lancer le duel','',startGridDuel),gbtn('Changer d’adversaire','alt',()=>{G.sel=null;gridRender()}));
  }else{
    const t=document.createElement('p');t.textContent='Touchez une case bleu clair pour défier son joueur, ou retournez sur le sol pour laisser la main à un autre candidat.';
    p.append(t);
    const me=G.players[G.ch],k=me.streak||0,s=document.createElement('p');
    s.textContent=(me.gold?'★ '+me.name+' détient la case d’or (+'+GOLD_SEC+' s, à utiliser avant un duel). ':'')+
      (k&&!me.gold?'Série : '+k+' victoire'+(k>1?'s':'')+' d’affilée, encore '+(GOLD_STREAK-k)+' pour la case d’or. Retourner sur le sol remet la série à zéro.':'');
    if(s.textContent)p.append(s);
    const b=sol();if(b)p.append(b);
  }
  $('gstat').textContent=alive+' joueur'+(alive>1?'s':'')+' en lice';
}
function startGridDuel(){
  // On attaque un joueur : le duel se joue dans sa catégorie d'origine (celle de sa case de départ).
  const a=G.ch,d=G.sel,cat=DATA[G.cells[d].cat];
  const use=[a,d].filter(q=>G.use.has(q)&&G.players[q].gold);
  const gold=use.map(q=>G.players[q].name).join(' et ');
  G.note='';
  startDuel({names:[G.players[a].name,G.players[d].name],pid:[a,d],src:cat.items,cat:cat.label,type:cat.type,T:G.T,oral:G.oral,
    bonus:[a,d].map(q=>use.includes(q)?GOLD_SEC*1000:0),goldUse:use,
    gold:gold?'★ Case d’or : '+gold+(use.length>1?' commencent':' commence')+' avec +'+GOLD_SEC+' s':''});
}
function gridAfterDuel(){
  const w=S.winP,l=S.loseP,a=G.ch,d=G.sel,cells=[];
  // Bord du duel : une case du défenseur voisine d'une case de l'attaquant (départ de la vague de capture).
  let from=[-1,-1];G.cells.forEach((c,i)=>{if(from[0]<0&&c.owner===d){const j=G.cells.findIndex((e,k)=>e.owner===a&&gadj(G.size,i,k));if(j>=0)from=[i,j]}});
  G.played.add(a);G.played.add(d);
  G.cells.forEach((c,i)=>{if(c.owner===l){c.owner=w;cells.push(i)}});
  G.anim={cells,old:l,to:w,from};
  const earn=goldEarns(w),W=G.players[w];
  S.goldUse.forEach(q=>{G.players[q].gold=false});
  G.players[l].alive=false;G.players[l].gold=false;G.players[l].streak=0;G.ch=w;G.sel=null;G.use.clear();
  G.over=G.players.filter(p=>p.alive).length===1;
  W.streak=(W.streak||0)+1;G.note='';
  if(W.streak>=GOLD_STREAK){W.streak=0;if(earn){W.gold=true;G.note='★ '+W.name+' gagne la case d’or : '+GOLD_STREAK+' victoires d’affilée, +'+GOLD_SEC+' s à utiliser au début d’un prochain duel.'}}
  show('grid');gridRender();
  if(earn){const g0=G;setTimeout(()=>{if(G===g0)snd('gold')},900)}
}
$('wback').onclick=()=>{
  if(!S||!S.pid||S.started||S.counting)return;
  S.over=true;push();G.sel=null;show('grid');gridRender();
};
$('gquit').onclick=()=>{if(G){clearTimeout(G.drawT);G.draw=false}show('setup')};
// Le plateau est dessiné à la largeur réelle de l'écran : on le redessine si elle change, et une fois la police chargée.
{let rt=0,lw=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=$('gboard').clientWidth;if(G&&!$('grid').hidden&&!gAnimT&&!G.draw&&w!==lw){lw=w;gridRender()}},150)})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G&&!$('grid').hidden&&!gAnimT&&!G.draw)gridRender()});
$('newcode').onclick=()=>{
  if(!S||!S.oral||S.started||S.counting)return;
  resetLink();S.link=null;$('code').textContent='…';$('go').disabled=true;
  $('wst').textContent='En attente de l’arbitre…';$('lnk').textContent='Liaison entre appareils : connexion…';
  attach(S);
};
$('f2').onsubmit=e=>{
  e.preventDefault();
  if(!S.started||S.lock||S.over)return;
  const v=$('ans').value;$('ans').value='';
  if(isOk(v,S.cur[1].split('|')))good();
  else{if(v.trim())flash('ko','Non, réessayez');render()}
};
$('pass').onclick=skip;
$('go').onclick=launch;
$('again').onclick=()=>{if(S&&S.pid&&S.over&&G&&S.winP!=null)gridAfterDuel();else show('setup')};

let R,L,cool=false,AFACE='',AIMG={k:null,src:null};
function arbRender(){
  if(!R){$('ast').textContent='En attente du jeu…';return}
  $('ast').textContent='';
  const t=R.t.slice();if(R.started&&!R.over)t[R.turn]-=performance.now()-R.at;
  for(let i=0;i<2;i++){const s=$('a'+i);s.querySelector('.nm').textContent=R.names[i];s.querySelector('.tm').textContent=Math.ceil(Math.max(0,t[i])/1000);s.classList.toggle('on',R.turn===i&&!R.over);s.classList.toggle('low',t[i]<=5000)}
  $('actx').textContent=R.cat?'Catégorie : '+R.cat:'';$('agold').textContent=R.gold||'';
  // Type de jeu et consigne à annoncer aux candidats.
  $('atype').hidden=!R.consigne;
  if(R.consigne){$('atype').querySelector('.tn').textContent='Type de jeu : '+(R.tnom||'Images');$('atype').querySelector('.tc').textContent='À annoncer : « '+R.consigne+' »'}
  const fk=R.started?'c|'+R.card[0]+'|'+R.disp+'|'+(R.type==='photo'&&AIMG.k===R.card[0]):'n|'+(R.count||'?');
  if(fk!==AFACE){AFACE=fk;if(R.started)paintCard($('acard'),R.type||'emoji',R.disp!=null?R.disp:R.card[0],AIMG.k===R.card[0]?AIMG.src:null);else{$('acard').className='';$('acard').textContent=R.count||'?'}}
  $('aans').textContent=R.over?'Duel terminé · en attente du prochain duel':R.count?'Départ dans '+R.count+'…':!R.started?'Le duel n’a pas encore démarré':'À '+R.names[R.turn]+' (niveau '+R.lvl+') · réponse : '+R.card[1].split('|').join(' / ');
  $('bok').disabled=$('bpass').disabled=!R.started||R.over||R.lock||cool;
}
function act(a){if(!L||!R||cool)return;L.send('act',{a,c:R.card[0]});cool=true;arbRender();setTimeout(()=>{cool=false;arbRender()},700)}
$('bok').onclick=()=>act('ok');
$('bpass').onclick=()=>act('pass');
$('rj').onsubmit=e=>{
  e.preventDefault();
  const c=$('rc').value.trim().toUpperCase();if(!c)return;
  $('rj').hidden=true;$('rl').hidden=false;arbRender();$('alk').textContent='Liaison entre appareils : connexion…';
  link(c,'arb',(topic,d)=>{if(topic==='st'){if(d.img)AIMG={k:d.card[0],src:d.img};R=d;R.at=performance.now();arbRender()}},(m,st)=>{$('alk').textContent=linkMsg(m,st)}).then(l=>{L=l;L.send('hi',{});setInterval(()=>L.send('hi',{}),3000);setInterval(arbRender,100)});
};
$('toarb').onclick=()=>show('arb');
$('arback').onclick=()=>show('setup');
if(isArb)show('arb');
addEventListener('hashchange',()=>location.reload());
</script>
